<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Paises UE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body class="container py-4">

<h1>Paises Miembros de la Unión Europea - José Antonio González Solano</h1>

<div id="idiomas" class="mb-3">
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="oficiales" name="oficiales">
        <label class="form-check-label" for="oficiales">Solo idiomas oficiales</label>
    </div>

    <div id="radio-contenedor" class="d-flex flex-wrap gap-1 align-items-center">
        <div class="d-inline-flex align-items-center gap-1 border border-secondary rounded px-2 py-1 me-1 mb-1 idioma-box">
            <input class="form-check-input m-0" type="radio" id="ninguno" name="idioma" value="ninguno" checked>
            <label class="form-check-label m-0" for="ninguno">Ninguno</label>
        </div>
    </div>
</div>

<div id="badge-informacion" class="badge bg-secondary p-2 mb-3 fs-6"></div>

<table class="table table-striped table-bordered align-middle">
    <thead class="table-light">
    <tr>
        <th>País</th>
        <th>Capital</th>
        <th>Población <span id="totalPoblacion"></span></th>
        <th>Fecha adhesión</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

</body>
</html>
